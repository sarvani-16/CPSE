server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sih26099-material-harmonization-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sih26099}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:saruu@1624}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

# AI / ML Microservice Integration
ml-service:
  url: ${ML_SERVICE_URL:http://localhost:8001}
  timeout-seconds: 15

# OpenAPI / Swagger Documentation
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# Logging Configuration
logging:
  level:
    root: INFO
    com.sih.material: DEBUG
    org.hibernate.SQL: WARN
