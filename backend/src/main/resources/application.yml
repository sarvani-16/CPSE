server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    context-path: /

spring:
  application:
    name: sih26099-material-harmonization-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sih26099}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

# JWT Security Configuration
jwt:
  secret: ${JWT_SECRET:SIH26099EnterpriseSecureMaterialHarmonizationSecretKey2026_CPSE_National_Master}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
cors:
  allowed-origins: ${FRONTEND_URL:}

# AI / ML Microservice Integration
ml-service:
  url: ${ML_SERVICE_URL:http://localhost:8001}
  timeout-seconds: 15

# OpenAPI / Swagger Documentation
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# Logging Configuration
logging:
  level:
    root: INFO
    com.sih.material: DEBUG
    org.hibernate.SQL: WARN
