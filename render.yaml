databases:
  - name: cpse-db
    databaseName: sih26099
    user: cpse_user
    plan: free
    region: oregon

services:
  # 1. FastAPI AI/ML Microservice
  - type: web
    name: cpse-ml-service
    runtime: python
    rootDir: ml-service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0

  # 2. Spring Boot Enterprise Backend (Docker)
  - type: web
    name: cpse-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cpse-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: cpse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cpse-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: cpse-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: cpse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cpse-db
          property: password
      - key: ML_SERVICE_URL
        value: https://cpse-ml-service.onrender.com
      - key: FRONTEND_URL
        value: https://*.onrender.com
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx320m -Xms128m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:MaxMetaspaceSize=128m"
      - key: JWT_SECRET
        generateValue: true

  # 3. React / Vite Frontend (Static Site)
  - type: web
    name: cpse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
